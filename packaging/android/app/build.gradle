plugins {
    id "com.android.application"
}

def propertyValue = { String name, String fallback ->
    providers.gradleProperty(name).orElse(fallback).get()
}

// Fallback only for direct ./gradlew runs; the Makefile always passes
// -PcorsaAppId=$(ANDROID_APPID). Keep both in sync.
def appId = propertyValue("corsaAppId", "chat.corsa.app")
def compileSdkLevel = propertyValue("corsaCompileSdk", "36").toInteger()
def minSdkLevel = propertyValue("corsaMinSdk", "26").toInteger()
def targetSdkLevel = propertyValue("corsaTargetSdk", "36").toInteger()
def appVersionCode = propertyValue("corsaVersionCode", "1").toInteger()
def appVersionName = propertyValue("corsaVersionName", "0.0.0")
def appName = propertyValue("corsaAppName", "Corsa")
def adaptiveIconBackground = propertyValue("corsaAdaptiveIconBackground", "#000000")
def legacyIcon = file(propertyValue(
    "corsaLegacyIcon",
    rootProject.file("../../assets/icons/png/app-icon-android-512.png").absolutePath,
))
def adaptiveIconForeground = file(propertyValue(
    "corsaAdaptiveIconForeground",
    rootProject.file("../../assets/icons/png/app-icon-android-foreground-512.png").absolutePath,
))
def gioArchive = file(propertyValue(
    "corsaGioArchive",
    rootProject.file("../../dist/corsa-android.aar").absolutePath,
))
// JNI jars gogio leaves out of the AAR. Its archive mode compiles only
// gioui.org/app's Java; the *.jar files of other imported packages are
// collected but used only by its -buildmode=exe path. gioui.org/x/explorer
// is one of those packages, and without its classes the system file picker
// behind Attach and Save as… fails inside jni.LoadClass — which the app can
// only report as "nothing happened". The Makefile stages them
// (`make android-extra-jars`) from the module cache.
def extraJarsDir = file(propertyValue(
    "corsaExtraJarsDir",
    rootProject.file("../../dist/android-libs").absolutePath,
))
// Keep this list aligned with the class names loaded through JNI by
// gioui.org/x/explorer. Merely finding an arbitrary jar in the staging
// directory is not enough: explorer_android without FileInfo, or without
// file_android, still builds successfully and fails only after a user picks a
// document.
def requiredExplorerClasses = [
    "org/gioui/x/explorer/explorer_android.class",
    'org/gioui/x/explorer/explorer_android$FileInfo.class',
    "org/gioui/x/explorer/file_android.class",
]
def generatedIconResources = layout.buildDirectory.dir("generated/corsa-icon-resources").get().asFile

def verifyCorsaInputs = tasks.register("verifyCorsaInputs") {
    inputs.files(gioArchive, legacyIcon, adaptiveIconForeground)
    doLast {
        [
            "Gio Android archive": gioArchive,
            "Legacy Android icon": legacyIcon,
            "Adaptive icon foreground": adaptiveIconForeground,
        ].each { label, input ->
            if (!input.isFile()) {
                throw new GradleException("${label} not found: ${input}")
            }
        }
        // A missing jar is not a missing feature at build time and a dead
        // button at run time: fail here, where the message can say what to do.
        def jars = extraJarsDir.isDirectory()
            ? extraJarsDir.listFiles({ f -> f.name.endsWith(".jar") } as FileFilter)
            : null
        if (jars == null || jars.length == 0) {
            throw new GradleException(
                "no JNI jars in ${extraJarsDir}: run `make android-extra-jars` " +
                "(the file picker's Java classes are not in the gogio AAR)")
        }
        def missingClasses = requiredExplorerClasses.findAll { className ->
            !jars.any { jar ->
                !zipTree(jar).matching { include className }.files.isEmpty()
            }
        }
        if (!missingClasses.isEmpty()) {
            throw new GradleException(
                "Android file-picker JNI classes are missing from ${extraJarsDir}: " +
                missingClasses.join(", ") + ". Run `make android-extra-jars`.")
        }
    }
}

def generateCorsaIconResources = tasks.register("generateCorsaIconResources", Sync) {
    dependsOn verifyCorsaInputs
    into generatedIconResources
    from(adaptiveIconForeground) {
        into "drawable-nodpi"
        rename { "ic_launcher_foreground.png" }
    }
    from(legacyIcon) {
        into "mipmap-xxxhdpi"
        rename { "ic_launcher.png" }
    }
}

android {
    // The AAR emitted by gogio uses the application ID as its namespace.
    // The wrapper owns no Java/Kotlin code, so a distinct namespace avoids a
    // manifest-merger collision without changing the installed package ID.
    namespace = "${appId}.wrapper"
    compileSdk = compileSdkLevel

    defaultConfig {
        applicationId = appId
        minSdk = minSdkLevel
        targetSdk = targetSdkLevel
        versionCode = appVersionCode
        versionName = appVersionName

        resValue "string", "app_name", appName
        resValue "color", "ic_launcher_background", adaptiveIconBackground
    }

    buildFeatures {
        resValues = true
    }

    buildTypes {
        debug {
            minifyEnabled = false
        }
        release {
            minifyEnabled = false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main {
            res.srcDir generatedIconResources
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn generateCorsaIconResources
}

dependencies {
    implementation files(gioArchive)
    implementation fileTree(dir: extraJarsDir, include: ["*.jar"])
}
