log-level: error
packages:
  # --- RPC layer providers ---
  github.com/piratecash/corsa/internal/core/rpc:
    config: &defaults
      dir: '{{.InterfaceDir}}/mocks'
      structname: 'Mock{{.InterfaceName}}'
      filename: '{{ .InterfaceName | snakecase }}.go'
      template: testify
      template-data:
        unroll-variadic: true
    interfaces:
      NodeProvider: {}
      ChatlogProvider: {}
      DMRouterProvider: {}
      MetricsProvider: {}
      RoutingProvider: {}
      ConnectionDiagnosticProvider: {}
      CaptureProvider: {}
      DatagramProvider: {}
      DiagnosticProvider: {}
      EndpointBindingProvider: {}
      EndpointDialDelayProvider: {}
  # --- Metrics collector ---
  github.com/piratecash/corsa/internal/core/metrics:
    config: *defaults
    interfaces:
      TrafficSource: {}
  # --- Routing announce loop ---
  github.com/piratecash/corsa/internal/core/routing:
    config: *defaults
    interfaces:
      PeerSender: {}
  # --- Capture subsystem ---
  github.com/piratecash/corsa/internal/core/capture:
    config: *defaults
    interfaces:
      ConnResolver: {}
      Writer: {}
  # --- Node service dependencies ---
  # Same-package test mocks: generated as _test.go files inside node/
  # so there is no cross-package import and therefore no circular dependency.
  github.com/piratecash/corsa/internal/core/node:
    config:
      dir: '{{.InterfaceDir}}'
      structname: 'Mock{{.InterfaceName}}'
      filename: 'mock_{{ .InterfaceName | snakecase }}_test.go'
      template: testify
      template-data:
        unroll-variadic: true
    interfaces:
      MessageStore: {}
      Router: {}
  # --- stdlib: net.Conn for node/netcore tests ---
  net:
    config:
      dir: 'internal/testutil/netmocks'
      structname: 'Mock{{.InterfaceName}}'
      pkgname: 'netmocks'
      filename: '{{ .InterfaceName | snakecase }}.go'
      template: testify
      template-data:
        unroll-variadic: true
    interfaces:
      Conn: {}
  # --- Release admission gate ---
  # ReleaseTree gets two mocks: a same-package _test.go one for the gate's
  # internal tests (an importable mock would import admission back and form
  # a cycle) and an importable one for the releaseadmission tool's tests.
  # pkgname 'mocks' keeps the import from shadowing the admission package.
  github.com/piratecash/corsa/internal/release/admission:
    config:
      structname: 'Mock{{.InterfaceName}}'
      template: testify
      template-data:
        unroll-variadic: true
    interfaces:
      ReleaseTree:
        configs:
          - dir: '{{.InterfaceDir}}'
            filename: 'mock_{{ .InterfaceName | snakecase }}_test.go'
          - dir: '{{.InterfaceDir}}/mocks'
            pkgname: 'mocks'
            filename: '{{ .InterfaceName | snakecase }}.go'
