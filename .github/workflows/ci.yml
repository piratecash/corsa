name: Checks

on:
  pull_request:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Run lint
        run: make lint

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Run govulncheck
        run: make vuln

  enforce-boundary:
    name: Enforce NetCore Boundary
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run enforce-netcore-boundary
        run: make enforce-netcore-boundary

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python for preflight controls
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Check release test scope and artifact report refusals
        run: |
          python scripts/test-test-release.py
          python scripts/test-report-candidate-artifacts.py
          python scripts/test-report-linux-desktop-cgo.py

      - name: Record release test package inventories
        id: release-inventory
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA:?}"
          printf 'S6 inventory begin %s %s %s\n' "$GITHUB_SHA" "${GITHUB_RUN_ID:?}" "${GITHUB_RUN_ATTEMPT:?}"
          go list -mod=readonly -f 'S6 default package {{.ImportPath}}' ./...
          CGO_ENABLED=1 go list -mod=readonly -tags sqlite_cgo -f 'S6 sqlite_cgo package {{.ImportPath}}' \
            ./internal/core/storage/... ./internal/core/chatlog/...
          printf 'S6 inventory end %s %s %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Run applicable release tests (overlaysim deferred to D1)
        run: bash scripts/run-ci-test-step.sh test-release

      - name: Run tagged S6 observation entry tests
        if: ${{ !cancelled() && steps.release-inventory.outcome == 'success' }}
        run: bash scripts/run-ci-test-step.sh test-s6-observation

      - name: Run storage tests against the cgo SQLite driver
        if: ${{ !cancelled() && steps.release-inventory.outcome == 'success' }}
        run: bash scripts/run-ci-test-step.sh test-cgo
