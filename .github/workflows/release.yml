name: Release

on:
  push:
    tags:
      - "v*"

# No workflow-level env or defaults: they would reach the admission job and
# change what the gate runs (internal/release/admission checks this).
permissions:
  contents: read

jobs:
  # The release gate (docs/release.md). Every other job needs it directly,
  # so a refusal stops the builds and the artifact uploads as well as the
  # GitHub release. internal/release/admission tests this wiring: no `if` or
  # continue-on-error here or on gated jobs, no write token and no step but
  # checkout, setup-go and the exact gate command.
  admission:
    name: Release admission
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the gate compares the tagged tree with the final
          # candidate commit named in the manifest.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release admission
        run: make release-admission RELEASE_TAG="${GITHUB_REF_NAME:?}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: admission
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Run lint
        run: make lint

  tests:
    name: Release tests
    runs-on: ubuntu-latest
    needs: admission
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python for preflight controls
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Check release test scope and artifact report refusals
        run: |
          python scripts/test-test-release.py
          python scripts/test-report-candidate-artifacts.py
          python scripts/test-report-linux-desktop-cgo.py

      - name: Run applicable release tests (overlaysim deferred to D1)
        run: make test-release

      - name: Run tagged S6 observation entry tests
        run: make test-s6-observation

      - name: Run storage tests against the cgo SQLite driver
        run: make test-cgo

  build-linux:
    name: Build (linux)
    runs-on: ubuntu-latest
    needs:
      - admission
      - lint
      - tests
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python for artifact verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Record Linux Desktop CGO environment
        shell: bash
        run: python scripts/report-linux-desktop-cgo.py --source-sha "$GITHUB_SHA"

      - name: Build binaries
        shell: bash
        run: |
          make build-node-linux-amd64
          make build-desktop-linux-amd64

      - name: Verify and package Linux release archive
        shell: bash
        run: python scripts/report-candidate-artifacts.py --release-archive --platform linux-amd64 --source-sha "$GITHUB_SHA"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corsa-linux
          path: |
            release/corsa-linux-amd64.tar.bz2
            release/corsa-linux-amd64.tar.bz2.json
          if-no-files-found: error

  build-platforms:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    needs:
      - admission
      - lint
      - tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: darwin-arm64
            runs_on: macos-latest
            build_cmds: |
              make build-node-macos-arm64
              make build-desktop-macos-arm64
          - name: macos-amd64
            platform: darwin-amd64
            runs_on: macos-15-intel
            build_cmds: |
              make build-node-macos-amd64
              make build-desktop-macos-amd64
          - name: windows-amd64
            platform: windows-amd64
            runs_on: windows-latest
            build_cmds: |
              make build-node-windows-amd64
              make build-desktop-windows-amd64
          - name: windows-arm64
            platform: windows-arm64
            runs_on: windows-latest
            build_cmds: |
              make build-node-windows-arm64
              make build-desktop-windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python for artifact verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build binaries
        shell: bash
        run: ${{ matrix.build_cmds }}

      - name: Verify and package platform release archive
        shell: bash
        run: python scripts/report-candidate-artifacts.py --release-archive --platform "${{ matrix.platform }}" --source-sha "$GITHUB_SHA"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corsa-${{ matrix.name }}
          path: release/corsa-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - admission
      - lint
      - tests
      - build-linux
      - build-platforms
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          merge-multiple: false

      - name: Setup Python for artifact verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The admission gate required this file, as a regular file, for the
      # build's version, and the tag equals that version; it is the release
      # body, never generated notes.
      - name: Check release notes
        shell: bash
        run: |
          notes_file="docs/release-notes/RELEASE-${GITHUB_REF_NAME}.md"
          if [ ! -f "${notes_file}" ] || [ -L "${notes_file}" ]; then
            echo "release notes ${notes_file} missing or not a regular file" >&2
            exit 1
          fi

      - name: Verify downloaded release archives
        shell: bash
        run: python scripts/report-candidate-artifacts.py --collect-release --source-sha "$GITHUB_SHA"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          target_commitish: ${{ github.sha }}
          files: |
            dist/corsa-linux-amd64.tar.bz2
            dist/corsa-darwin-arm64.tar.bz2
            dist/corsa-darwin-amd64.tar.bz2
            dist/corsa-windows-amd64.zip
            dist/corsa-windows-arm64.zip
          fail_on_unmatched_files: true
          body_path: docs/release-notes/RELEASE-${{ github.ref_name }}.md
