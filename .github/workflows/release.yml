name: Release

on:
  push:
    tags:
      - "v*"

# No workflow-level env or defaults: they would reach the admission job and
# change what the gate runs (internal/release/admission checks this).
permissions:
  contents: read

jobs:
  # The release gate (docs/release.md). Every other job needs it directly,
  # so a refusal stops the builds and the artifact uploads as well as the
  # GitHub release. internal/release/admission tests this wiring: no `if` or
  # continue-on-error here or on gated jobs, no write token and no step but
  # checkout, setup-go and the exact gate command.
  admission:
    name: Release admission
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the gate compares the tagged tree with the final
          # candidate commit named in the manifest.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check release admission
        run: make release-admission RELEASE_TAG="${GITHUB_REF_NAME:?}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: admission
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Run lint
        run: make lint

  build-linux:
    name: Build (linux)
    runs-on: ubuntu-latest
    needs:
      - admission
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Build binaries
        shell: bash
        run: |
          make build-node-linux-amd64
          make build-desktop-linux-amd64

      - name: Package Linux artifacts
        shell: bash
        run: |
          package_dir="release/corsa-linux-amd64"
          install -d \
            "${package_dir}/bin" \
            "${package_dir}/share/applications" \
            "${package_dir}/share/icons/hicolor/256x256/apps"
          install -m 0755 dist/corsa-node-linux-amd64 \
            "${package_dir}/bin/corsa-node"
          install -m 0755 dist/corsa-desktop-linux-amd64 \
            "${package_dir}/bin/corsa-desktop"
          install -m 0644 packaging/linux/corsa.desktop \
            "${package_dir}/share/applications/corsa.desktop"
          install -m 0644 assets/icons/png/app-icon-256.png \
            "${package_dir}/share/icons/hicolor/256x256/apps/corsa.png"
          tar -cjf release/corsa-linux-amd64.tar.bz2 -C release \
            corsa-linux-amd64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corsa-linux
          path: release/corsa-linux-amd64.tar.bz2
          if-no-files-found: error

  build-platforms:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    needs:
      - admission
      - lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runs_on: macos-latest
            build_cmds: |
              make build-node-macos-arm64
              make build-desktop-macos-arm64
          - name: macos-amd64
            runs_on: macos-15-intel
            build_cmds: |
              make build-node-macos-amd64
              make build-desktop-macos-amd64
          - name: windows-amd64
            runs_on: windows-latest
            build_cmds: |
              make build-node-windows-amd64
              make build-desktop-windows-amd64
          - name: windows-arm64
            runs_on: windows-latest
            build_cmds: |
              make build-node-windows-arm64
              make build-desktop-windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        shell: bash
        run: ${{ matrix.build_cmds }}

      - name: Package macOS artifacts
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.name }}" = "macos-arm64" ]; then
            tar -cjf release/corsa-darwin-arm64.tar.bz2 -C dist \
              corsa-node-darwin-arm64 \
              Corsa-darwin-arm64.app
          else
            tar -cjf release/corsa-darwin-amd64.tar.bz2 -C dist \
              corsa-node-darwin-amd64 \
              Corsa-darwin-amd64.app
          fi

      - name: Package Windows artifacts
        if: startsWith(matrix.name, 'windows-')
        shell: bash
        run: |
          mkdir -p release
          powershell -Command "Compress-Archive -Path dist/corsa-node-${{ matrix.name }}.exe,dist/corsa-desktop-${{ matrix.name }}.exe -DestinationPath release/corsa-${{ matrix.name }}.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corsa-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - admission
      - build-linux
      - build-platforms
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;

      # The admission gate required this file, as a regular file, for the
      # build's version, and the tag equals that version; it is the release
      # body, never generated notes.
      - name: Check release notes
        shell: bash
        run: |
          notes_file="docs/release-notes/RELEASE-${GITHUB_REF_NAME}.md"
          if [ ! -f "${notes_file}" ] || [ -L "${notes_file}" ]; then
            echo "release notes ${notes_file} missing or not a regular file" >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/release-notes/RELEASE-${{ github.ref_name }}.md
