name: Native Windows filesystem and logging checks

on:
  pull_request:
  push:
    branches: [dev, master]
  workflow_dispatch:

# Native filesystem evidence only; no application or publication steps.
permissions:
  contents: read

jobs:
  secretfile:
    name: Native Windows amd64 filesystem and logging
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: "off"
      GOOS: windows
      GOARCH: amd64
      GOMAXPROCS: "2"
      GOMEMLIMIT: 768MiB
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go from source
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify and record native host and source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8

          if (-not $IsWindows -or
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or
              [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64') {
            throw 'This job requires a native Windows amd64 host and process.'
          }
          Write-Host "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "Image: $env:ImageOS $env:ImageVersion; PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Token SID: $([System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value)"

          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read checkout commit.' }
          if ($head -cne $env:GITHUB_SHA) { throw 'Checkout does not match triggering commit.' }
          $dirty = & git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect checkout status.' }
          if ($dirty) { throw 'Expected an unmodified source checkout.' }
          Write-Host "Source: $head"

          & go version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Go version.' }
          $goHostOS = & go env GOHOSTOS
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Go host OS.' }
          $goHostArch = & go env GOHOSTARCH
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Go host architecture.' }
          if ($goHostOS -cne 'windows' -or $goHostArch -cne 'amd64') {
            throw 'Go must execute natively on Windows amd64.'
          }
          & go env GOHOSTOS GOHOSTARCH GOOS GOARCH CGO_ENABLED GOTOOLCHAIN GOMOD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record Go environment.' }

      - name: Run complete native secretfile and crashlog suites
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8

          # Keep every JSON RUN/PASS/FAIL/SKIP and native stderr in the job log.
          # Capability SKIPs remain UNVERIFIED; a green job is not S6 admission.
          # No pipeline or output formatter may replace the Go exit status.
          & go test -json -count=1 -p=1 -parallel=1 -timeout=10m ./internal/core/secretfile ./internal/core/crashlog
          $testExit = $LASTEXITCODE
          exit $testExit
